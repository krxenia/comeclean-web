<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ComeClean Discussion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0a0a0a; color: #b0b0b0; font-family: sans-serif; padding: 15px; margin: 0; }
        #list { margin-bottom: 100px; }
        .main-post { background: #1a1a1a; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        .main-post-title { color: #888; font-size: 0.8em; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .main-post-text { color: white; font-size: 1.1em; line-height: 1.4; }
        .msg-container { margin-bottom: 15px; }
        .msg { background: #161616; padding: 12px; border-radius: 12px; display: flex; gap: 12px; }
        .reply-msg { margin-left: 30px; border-left: 1px solid #333; padding-left: 15px; margin-top: 5px; }
        .avatar { width: 35px; height: 35px; background: #333; border-radius: 50%; flex-shrink: 0; }
        .author-name { font-weight: bold; color: #eee; font-size: 0.9em; margin-bottom: 4px; display: block; }
        .text { font-size: 0.95em; line-height: 1.4; }
        .reply-btn { background: none; border: none; color: #555; font-size: 0.8em; padding: 5px 0; cursor: pointer; text-decoration: underline; }
        .panel { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f0f; padding: 15px; border-top: 1px solid #222; }
        .reply-info { font-size: 0.8em; color: #666; margin-bottom: 8px; display: none; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input { background: #1a1a1a; border: none; color: white; padding: 12px 18px; flex-grow: 1; border-radius: 25px; outline: none; }
        .send-btn { background: none; border: none; color: #888; font-size: 1.5em; cursor: pointer; }
    </style>
</head>
<body>
    <div id="header-post"></div>
    <div id="list">Загрузка обсуждения...</div>
    <div class="panel">
        <div id="reply-to-info" class="reply-info">Ответ <span id="reply-author"></span> <span onclick="cancelReply()" style="cursor:pointer">✕</span></div>
        <div class="input-row">
            <input type="text" id="comm-input" placeholder="напиши что-нибудь..." onkeypress="if(event.key==='Enter') doSend()">
            <button class="send-btn" onclick="doSend()">➔</button>
        </div>
    </div>

    <script>
    const MY_URL = 'https://toeqmqoswcjbiratydnx.supabase.co';
    const MY_KEY = 'sb_publishable_r_jeI0wGwc_zIOY7fo5zlA_KyYQlOyG';
    const db = window.supabase.createClient(MY_URL, MY_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const currentPostId = urlParams.get('id') || 'demo';
    const rawText = urlParams.get('text') || 'Текст исповеди...';
    
    let replyingToId = null;

    // 1. Генерируем или достаем из памяти твой личный ID для этой исповедальни
    let myId = localStorage.getItem('comeclean_uid');
    if (!myId) {
        myId = 'u_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('comeclean_uid', myId);
    }

    function drawHeader() {
        var txt = decodeURIComponent(rawText);
        var html = '<div class="main-post">' +
                   '<div class="main-post-title">Исповедь #' + currentPostId.slice(-4) + '</div>' +
                   '<div class="main-post-text">' + txt + '</div>' +
                   '</div>';
        document.getElementById('header-post').innerHTML = html;
    }

    async function showComments() {
        const { data } = await db.from('comments').select('*').eq('post_id', currentPostId).order('created_at', { ascending: true });
        const container = document.getElementById('list');
        container.innerHTML = '';
        
        if (data && data.length > 0) {
            // Создаем список уникальных авторов в этом обсуждении
            var authors = [];
            data.forEach(function(item) {
                if (item.user_id && authors.indexOf(item.user_id) === -1) {
                    authors.push(item.user_id);
                }
            });

            data.forEach(function(item) {
                // Определяем номер батюшки по его ID в списке авторов
                var authorNum = authors.indexOf(item.user_id) + 1;
                if (authorNum === 0) authorNum = '?'; // На случай старых записей без ID

                var div = document.createElement('div');
                div.className = item.parent_id ? 'msg-container reply-msg' : 'msg-container';
                div.innerHTML = '<div class="msg">' +
                                '<div class="avatar"></div>' +
                                '<div class="content">' +
                                '<span class="author-name">батюшка_' + authorNum + '</span>' +
                                '<div class="text">' + item.text + '</div>' +
                                '<button class="reply-btn" onclick="prepareReply(\'' + item.id + '\', \'батюшка_' + authorNum + '\')">ответить</button>' +
                                '</div></div>';
                container.appendChild(div);
            });
        } else { container.innerText = 'Здесь пока пусто...'; }
    }

    function prepareReply(id, name) {
        replyingToId = id;
        document.getElementById('reply-to-info').style.display = 'block';
        document.getElementById('reply-author').innerText = name;
        document.getElementById('comm-input').focus();
    }

    function cancelReply() {
        replyingToId = null;
        document.getElementById('reply-to-info').style.display = 'none';
    }

    async function doSend() {
        const el = document.getElementById('comm-input');
        const txt = el.value.trim();
        if (!txt) return;
        
        // Отправляем комментарий вместе с твоим личным ID
        const { error } = await db.from('comments').insert([{ 
            text: txt, 
            post_id: currentPostId, 
            parent_id: replyingToId,
            user_id: myId 
        }]);
        
        if (error) { alert('Ошибка! Проверь RLS.'); } else { el.value = ''; cancelReply(); showComments(); }
    }

    drawHeader();
    showComments();
// Слушаем обновления в реальном времени
db.channel('public:comments')
  .on('postgres_changes', { 
      event: 'INSERT', 
      schema: 'public', 
      table: 'comments',
      filter: 'post_id=eq.' + currentPostId // Слушаем только этот пост
  }, function(payload) {
      console.log('Пришел новый батюшка!', payload);
      showComments(); // Перерисовываем список
  })
  .subscribe();
</script>
